---
name: Azure Data Factory Terratest

on:
  pull_request:
    paths:
      - "azure/azure_data_factory/**"
      - "tests/azure/azure_data_factory/**"

permissions:
  contents: read
  id-token: write

jobs:
  azure-data-factory:
    name: Azure Data Factory
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tests/azure/azure_data_factory/go.mod
          cache-dependency-path: tests/azure/azure_data_factory/go.sum

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.5"

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Terratest
        working-directory: tests/azure/azure_data_factory
        run: go test -run TestTerraformScenarios/base -v
